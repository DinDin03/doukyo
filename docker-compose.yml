# Local infrastructure for Doukyo.
# Phase 0/1: just PostgreSQL. Redis and Kafka join later (design doc §5.3).
#
# Start it:   docker compose up -d
# Stop it:    docker compose down
# Wipe data:  docker compose down -v   (removes the volume — fresh DB)
services:
  postgres:
    image: postgres:16
    container_name: doukyo-postgres
    environment:
      POSTGRES_DB: doukyo
      POSTGRES_USER: doukyo
      POSTGRES_PASSWORD: doukyo   # local only — never a real secret
    ports:
      # host:container. Host port 5433 (not 5432) to avoid colliding with a
      # Homebrew postgresql already listening on the Mac's 5432. Inside the
      # container Postgres still uses 5432; we just publish it on 5433.
      - "5433:5432"               # reachable from the Mac at localhost:5433
    volumes:
      - doukyo_pgdata:/var/lib/postgresql/data
    healthcheck:                  # lets other tools wait until Postgres is truly ready
      test: ["CMD-SHELL", "pg_isready -U doukyo -d doukyo"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  doukyo_pgdata:                  # named volume => data survives `down`, dies on `down -v`
